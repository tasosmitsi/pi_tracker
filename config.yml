# pi_tracker settings. Anything left out falls back to the default in settings.py.

mqtt:
  host: 192.168.178.203
  port: 4433
  path: /ws                    # WebSocket path
  client_id: pi0w              # also the first level of every topic
  keepalive_s: 60
  qos: 1
  retain: false
  ca_certs: certs/ca_certificate.crt
  certfile: certs/client_certificate.crt
  keyfile: certs/client_private.key
  reconnect_min_s: 1           # wait before retrying a connection; it doubles after each failure...
  reconnect_max_s: 120         # ...up to this
  session_expiry_s: 604800     # while offline, the broker queues QoS 1 commands for up to 7 days
  will_delay_s: 30             # status goes offline only after this long without a connection

intervals:
  telemetry_s: 5               # whole seconds
  button_poll_s: 2             # whole seconds
  sensor_loop_s: 0.5

log:
  level: INFO                  # DEBUG also shows the sensor readings; PI_TRACKER_LOG_LEVEL overrides this

state:
  directory: ~/.local/state/pi_tracker   # alarm state etc.; outside the repo so autosync can't delete it
